<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1001 Albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>

<header>
  <div>
    <h1>1001 Albums</h1>
    <div class="sub">EEN PERSOONLIJKE LUISTERTOCHT</div>
  </div>
  <div class="header-right">
    <input class="search" id="searchInput" type="text" placeholder="zoek artiest, album, jaar, genre...">
    <img class="avatar" src="img/Platenspeler_klein.png" alt="Ed van Nunen">
  </div>
</header>

<div class="dashboard">
  <div class="dash-panel">
    <div class="dash-label"><span class="disc"></span>Voortgang</div>
    <div class="ring-wrap">
      <div class="ring">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle class="ring-track" cx="44" cy="44" r="38"></circle>
          <circle class="ring-fill" id="progressRing" cx="44" cy="44" r="38"
            stroke-dasharray="238.76" stroke-dashoffset="238.76"></circle>
        </svg>
        <div class="ring-center mono" id="progressLabel">0%</div>
      </div>
      <div class="ring-caption"><b id="doneCount">0</b> van 1001<br>gehoord &amp; besproken</div>
    </div>
  </div>
  <div class="dash-panel">
    <div class="dash-label" id="decadeLabel"><span class="disc"></span>Albums per decennium</div>
    <div class="chart-wrap"><canvas id="decadeChart"></canvas></div>
  </div>
  <div class="dash-panel">
    <div class="dash-label" id="genreLabel"><span class="disc"></span>Genres</div>
    <div class="bubble-wrap" id="genreBubbles"></div>
  </div>
  <div class="dash-panel">
    <div class="dash-label" id="countryLabel"><span class="disc"></span>Landen</div>
    <div class="chart-wrap chart-wrap-tall"><canvas id="countryChart"></canvas></div>
  </div>
</div>

<div class="controls">
  <div class="toggle-group">
    <button id="viewGrid" class="active">Grid</button>
    <button id="viewTable">Tabel</button>
  </div>
  <div>
    <label class="mono" style="font-size:0.72rem;color:var(--ink-dim);margin-right:8px;">SORTEER</label>
    <select id="sortSelect">
      <option value="number">Nummer (boek)</option>
      <option value="year">Jaar</option>
      <option value="artist">Artiest</option>
      <option value="album">Album</option>
    </select>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <span class="filter-label">FILTERS:</span>
  <div id="filterChips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  <button class="clear-filters" id="clearFilters">Alles wissen</button>
</div>

<div id="grid"></div>
<table id="table" class="hidden">
  <thead>
    <tr>
      <th data-key="number">#</th>
      <th data-key="artist">Artiest</th>
      <th data-key="album">Album</th>
      <th data-key="year">Jaar</th>
      <th data-key="country">Land</th>
      <th data-key="genres">Genre</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>
<div id="emptyState" class="empty-state hidden">Geen albums gevonden voor deze zoekopdracht.</div>
<div class="pagination" id="pagination"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <div class="modal-cover" id="modalCover"></div>
      <div class="modal-title-block">
        <div class="catalog mono" id="modalCatalog"></div>
        <h2 id="modalArtist"></h2>
        <div class="modal-album" id="modalAlbum"></div>
        <div class="modal-badges" id="modalBadges"></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="review-text" id="modalText"></div>
      <div class="media-list" id="modalMedia"></div>
      <div class="more-by-artist hidden" id="modalMoreByArtist">
        <div class="dash-label">Meer van deze artiest</div>
        <ul id="modalMoreByArtistList"></ul>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
